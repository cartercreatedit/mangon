<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena Node Matrix</title>
    <style>
        @import url('https://googleapis.com');

        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background-color: #030307; color: #e3e3e3;
            font-family: 'Roboto', sans-serif; overflow-x: hidden; user-select: none;
        }

        /* ── NATIVE CHROME NOTIFICATION POPUP BOX MIMIC ── */
        #notification-gate {
            position: fixed; top: 12px; left: 100px;
            width: 290px; background-color: #1e1e1e;
            border-radius: 8px; box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            z-index: 5000; padding: 16px; box-sizing: border-box;
            border: 1px solid #333333; font-size: 13px; color: #ffffff;
            display: flex; flex-direction: column; gap: 12px;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .notif-header { font-weight: 500; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
        .notif-close { cursor: pointer; color: #888; font-size: 16px; }
        .notif-close:hover { color: #fff; }
        .notif-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .btn-action {
            background-color: #2b2b2b; border: 1px solid #444; color: white;
            padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .btn-action.primary { background-color: #0078d4; border-color: #0078d4; }
        .btn-action:hover { filter: brightness(1.2); }

        /* ── PREMIUM NAV CONTROLS UTILITY BAR ── */
        header {
            width: 100%; height: 65px; background-color: #08080f;
            border-bottom: 1px solid #121222; display: flex;
            align-items: center; justify-content: space-between;
            padding: 0 24px; box-sizing: border-box;
            position: fixed; top: 0; left: 0; z-index: 1000;
        }
        .brand-cluster { display: flex; align-items: center; gap: 8px; font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; color: #ffffff; }
        .brand-icon { width: 24px; height: 24px; background-color: #00ff66; border-radius: 50%; box-shadow: 0 0 10px #00ff66; }
        .brand-cluster span { color: #00ff66; font-size: 14px; margin-left: 10px; background: rgba(0,255,102,0.1); padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(0,255,102,0.2); }
        
        .telemetry-deck { display: flex; align-items: center; gap: 15px; font-size: 13px; color: #888aa0; }
        .telemetry-node { background-color: #0f0f1b; border: 1px solid #1a1a30; padding: 4px 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; }
        .telemetry-node span { color: #00ffcc; font-weight: bold; }

        .search-console {
            width: 320px; background-color: #0d0d18;
            border: 1px solid #1c1c35; border-radius: 18px;
            padding: 6px 16px; display: flex; align-items: center;
        }
        .search-console input {
            width: 100%; background: transparent; border: none;
            outline: none; color: #ffffff; font-size: 14px; font-family: inherit;
        }

        /* ── DENSE EXTENSIVE GAME CARD MATRIX GRID ── */
        .workspace-container {
            max-width: 1400px; margin: 95px auto 40px auto;
            padding: 0 24px; box-sizing: border-box;
        }
        .sort-metadata { display: flex; justify-content: flex-end; font-size: 12px; color: #6b6d85; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .grid-matrix {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 16px;
        }
        .card-node {
            background-color: #090911; border: 1px solid #121224; border-radius: 12px;
            overflow: hidden; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; aspect-ratio: 1 / 1; display: flex;
            flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box;
        }
        .card-node:hover {
            transform: translateY(-4px); border-color: #00ff66;
            box-shadow: 0 10px 24px rgba(0, 255, 102, 0.15);
        }
        .card-meta-title {
            font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 500; color: #ffffff;
            text-transform: uppercase; letter-spacing: 0.5px; z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,1), 0 1px 2px rgba(0,0,0,1);
            line-height: 1.2;
        }
        /* Top right card badge tracking circle */
        .badge-star {
            position: absolute; top: 10px; right: 10px;
            width: 18px; height: 18px; border-radius: 50%;
            background-color: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #00ff66; z-index: 5;
        }

        /* ── INTERACTIVE CANVAS VIEW SCREEN ── */
        #game-theater {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 6000; display: none;
        }
        .theater-bar {
            width: 100%; height: 50px; background-color: #08080f;
            display: flex; align-items: center; padding: 0 20px;
            box-sizing: border-box; border-bottom: 1px solid #121222;
        }
        .btn-exit {
            background-color: #1a1a2e; border: none; color: white;
            font-family: inherit; padding: 6px 16px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 13px; transition: background 0.15s;
        }
        .btn-exit:hover { background-color: #ff3344; }
        iframe { width: 100%; height: calc(100% - 50px); border: none; background-color: #000000; }
    </style>
</head>
